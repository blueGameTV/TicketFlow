  <rect x="1110" y="70" width="200" height="64" rx="18" fill="#ffffff" opacity=".14"/>
  <text x="1210" y="111" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">v1.1.0 Stable</text>
