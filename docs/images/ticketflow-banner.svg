<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">TicketFlow v1.2.0 Stable</title>
  <desc id="desc">Bannière TicketFlow modernisée présentant le parcours Collaborateur, Support IT, Manager et Administrateur.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07183f"/>
      <stop offset="48%" stop-color="#123fb8"/>
