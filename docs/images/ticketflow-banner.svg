<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">TicketFlow v1.1.0</title>
  <desc id="desc">Bannière TicketFlow avec le flux de gestion des tickets et les fonctions d'alertes et de maintenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="55%" stop-color="#3156d9"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1240" cy="70" r="160" fill="#ffffff" opacity=".06"/>
  <circle cx="1320" cy="355" r="210" fill="#ffffff" opacity=".05"/>
  <g transform="translate(82 72)">
    <rect width="80" height="80" rx="22" fill="#ffffff" opacity=".15"/>
    <path d="M22 27h36v27H34l-8 8v-8h-4z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="34" cy="40" r="3.5" fill="#fff"/>
    <circle cx="44" cy="40" r="3.5" fill="#fff"/>
    <circle cx="54" cy="40" r="3.5" fill="#fff"/>
  </g>
  <text x="190" y="118" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">TicketFlow</text>
  <text x="192" y="162" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="25">Plateforme interne de gestion des tickets IT</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" filter="url(#shadow)">
    <rect x="90" y="245" width="250" height="92" rx="20" fill="#ffffff"/>
    <text x="215" y="282" text-anchor="middle" fill="#111827">Collaborateur</text>
    <text x="215" y="313" text-anchor="middle" fill="#64748b" font-size="16" font-weight="400">Crée et suit la demande</text>

    <rect x="410" y="245" width="250" height="92" rx="20" fill="#ffffff"/>
    <text x="535" y="282" text-anchor="middle" fill="#111827">IT</text>
    <text x="535" y="313" text-anchor="middle" fill="#64748b" font-size="16" font-weight="400">Traite et communique</text>

    <rect x="730" y="245" width="250" height="92" rx="20" fill="#ffffff"/>
    <text x="855" y="282" text-anchor="middle" fill="#111827">Manager</text>
    <text x="855" y="313" text-anchor="middle" fill="#64748b" font-size="16" font-weight="400">Valide si nécessaire</text>

    <rect x="1050" y="245" width="250" height="92" rx="20" fill="#ffffff"/>
    <text x="1175" y="282" text-anchor="middle" fill="#111827">Administrateur</text>
    <text x="1175" y="313" text-anchor="middle" fill="#64748b" font-size="16" font-weight="400">Supervise et configure</text>
  </g>

  <g fill="none" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round">
    <path d="M345 291h55"/>
    <path d="M665 291h55"/>
    <path d="M985 291h55"/>
